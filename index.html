<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détection d'objets</title>
</head>
<body>

    <h1>Détection d'objets</h1>

    <!-- Contrôles de l'application -->
    <div style="margin-bottom: 10px;">
        <button id="startBtn">Démarrer la caméra</button>
        <button id="stopBtn" disabled>Stopper</button>
    </div>

    <!-- Paramètres demandés par le sujet -->
    <div style="margin-bottom: 15px; padding: 10px; background: #eee; display: inline-block;">
        <label>Modèle : 
            <select id="modelSelect">
                <option value="efficientdet_lite0">EfficientDet-Lite0 (Rapide)</option>
                <option value="efficientdet_lite1">EfficientDet-Lite1 (Équilibré)</option>
                <option value="efficientdet_lite2">EfficientDet-Lite2 (Précis)</option>
            </select>
        </label>
        
        <label style="margin-left: 15px;">Max Objets : 
            <input type="number" id="maxResults" value="5" min="1" max="20" style="width: 50px;">
        </label>

        <label style="margin-left: 15px;">Seuil de score minimum : 
            <input type="range" id="scoreThreshold" min="0.1" max="0.9" step="0.05" value="0.5">
            <span id="thresholdValue">0.5</span>
        </label>
    </div>

    <!-- Conteneur vidéo + canvas superposé -->
    <div style="position: relative; width: 640px; height: 480px;">
        <video id="webcam" autoplay playsinline style="position: absolute; top: 0; left: 0; width: 640px; height: 480px;"></video>
        <canvas id="output_canvas" width="640" height="480" style="position: absolute; top: 0; left: 0; width: 640px; height: 480px; pointer-events: none;"></canvas>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

        let objectDetector = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;
        let results = undefined;

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const canvasCtx = canvas.getContext("2d");

        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const modelSelect = document.getElementById("modelSelect");
        const maxResultsInput = document.getElementById("maxResults");
        const scoreThresholdInput = document.getElementById("scoreThreshold");
        const thresholdValue = document.getElementById("thresholdValue");

        scoreThresholdInput.addEventListener("input", (e) => {
            thresholdValue.textContent = e.target.value;
            updateDetectorOptions();
        });

        maxResultsInput.addEventListener("change", () => {
            updateDetectorOptions();
        });

        modelSelect.addEventListener("change", () => {
            initObjectDetector();
        });

        // 1. Initialisation de l'Object Detector
        async function initObjectDetector() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
            );

            // Choix du fichier de modèle selon la liste déroulante
            const modelName = modelSelect.value; // ex: efficientdet_lite0
            const modelAssetPath = `https://storage.googleapis.com/mediapipe-models/object_detector/${modelName}/float16/1/${modelName}.tflite`;

            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: modelAssetPath,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                maxResults: parseInt(maxResultsInput.value),
                scoreThreshold: parseFloat(scoreThresholdInput.value)
            });
            startBtn.disabled = false;
            console.log("ObjectDetector chargé avec le modèle :", modelName);
        }

        // Mettre à jour les options sans tout réinitialiser si possible, ou recréer
        async function updateDetectorOptions() {
            if (!objectDetector) return;
            // On recrée l'instance avec les nouveaux paramètres de seuil et de max results
            await initObjectDetector();
        }

        initObjectDetector();

        // 2. Démarrage de la caméra (compatible smartphone via environment)
        async function enableCam() {
            if (!objectDetector) return;

            webcamRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            const constraints = {
                video: {
                    width: 640,
                    height: 480,
                    facingMode: "environment" // Utilise la caméra arrière sur smartphone si disponible
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            } catch (err) {
                alert("Erreur d'accès à la webcam : " + err.message);
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        // 3. Boucle de détection sur le flux vidéo
        async function predictWebcam() {
            if (!webcamRunning) return;

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                results = objectDetector.detectForVideo(video, Date.now());

                // Nettoyage du canvas
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                // Affichage des boîtes englobantes, catégories et scores
                if (results.detections) {
                    for (const detection of results.detections) {
                        const bbox = detection.boundingBox;
                        const category = detection.categories[0];
                        const categoryName = category.categoryName;
                        const score = Math.round(category.score * 100);

                        // Dessiner la boîte englobante (Bounding Box)
                        canvasCtx.strokeStyle = "#00FF00";
                        canvasCtx.lineWidth = 3;
                        canvasCtx.strokeRect(bbox.originX, bbox.originY, bbox.width, bbox.height);

                        // Dessiner le fond du texte pour la lisibilité
                        canvasCtx.fillStyle = "rgba(0, 255, 0, 0.7)";
                        const text = `${categoryName} (${score}%)`;
                        canvasCtx.font = "16px Arial";
                        const textWidth = canvasCtx.measureText(text).width;
                        canvasCtx.fillRect(bbox.originX, bbox.originY > 20 ? bbox.originY - 20 : 0, textWidth + 10, 20);

                        // Écrire le texte (Nom + Score)
                        canvasCtx.fillStyle = "#000000";
                        canvasCtx.fillText(text, bbox.originX + 5, bbox.originY > 20 ? bbox.originY - 5 : 15);
                    }
                }
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }

        startBtn.addEventListener("click", enableCam);

        stopBtn.addEventListener("click", () => {
            webcamRunning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });
    </script>
</body>
</html>
