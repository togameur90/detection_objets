<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détection d'objets</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        button, select, input { padding: 8px; font-size: 14px; margin: 5px; }
        .controls { background: #eee; padding: 10px; display: inline-block; border-radius: 5px; margin-bottom: 10px; }
        
        .camera-container {
            position: relative;
            display: inline-block;
            width: 640px;
            max-width: 100%;
            height: 480px;
            background: #000;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Détection d'objets</h1>
    
    <div>
        <button id="startBtn">Démarrer</button>
        <button id="stopBtn" disabled>Stopper</button>
    </div>

    <div class="controls">
        <label>Modèle :
            <select id="modelSelect">
                <option value="efficientdet_lite0">EfficientDet-Lite0</option>
                <option value="efficientdet_lite1">EfficientDet-Lite1</option>
                <option value="efficientdet_lite2">EfficientDet-Lite2</option>
            </select>
        </label><br>
        
        <label>Max objets : 
            <input type="number" id="maxResults" value="5" min="1" max="20" style="width: 50px;">
        </label><br>

        <label>Seuil score : 
            <input type="range" id="scoreThreshold" min="0.1" max="0.9" step="0.1" value="0.5">
            <span id="scoreVal">0.5</span>
        </label>
    </div>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

        let detector;
        let running = false;
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const modelSelect = document.getElementById("modelSelect");
        const maxResultsInput = document.getElementById("maxResults");
        const scoreThresholdInput = document.getElementById("scoreThreshold");
        const scoreVal = document.getElementById("scoreVal");

        scoreThresholdInput.oninput = (e) => {
            scoreVal.innerText = e.target.value;
        };

        async function initDetector() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
            
            const modelName = modelSelect.value;
            detector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/${modelName}/float16/1/${modelName}.tflite`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                maxResults: parseInt(maxResultsInput.value),
                scoreThreshold: parseFloat(scoreThresholdInput.value)
            });
            document.getElementById("startBtn").disabled = false;
        }

        modelSelect.onchange = initDetector;
        maxResultsInput.onchange = initDetector;
        scoreThresholdInput.onchange = initDetector;

        initDetector();

        document.getElementById("startBtn").onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
            running = true;
            document.getElementById("startBtn").disabled = true;
            document.getElementById("stopBtn").disabled = false;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                predict();
            };
        };

        document.getElementById("stopBtn").onclick = () => {
            running = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById("startBtn").disabled = false;
            document.getElementById("stopBtn").disabled = true;
        };

        async function predict() {
            if (!running) return;
            const results = detector.detectForVideo(video, performance.now());
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.detections) {
                for (let d of results.detections) {
                    const box = d.boundingBox;
                    const name = d.categories[0].categoryName;
                    const score = Math.round(d.categories[0].score * 100);

                    ctx.strokeStyle = "#00FF00";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(box.originX, box.originY, box.width, box.height);

                    ctx.fillStyle = "#00FF00";
                    ctx.font = "16px Arial";
                    ctx.fillText(`${name} (${score}%)`, box.originX, box.originY > 20 ? box.originY - 5 : 20);
                }
            }
            requestAnimationFrame(predict);
        }
    </script>
</body>
</html>
